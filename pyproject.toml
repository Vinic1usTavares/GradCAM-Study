[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gradcam"
version = "0.1.0"
description = "Estudo e replicação do Grad-CAM"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9",
    "torchvision>=0.24",
    "numpy>=2.0",
    "pillow>=11.0",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "tqdm>=4.66",
    "pytest>=8.0"
]

[tool.setuptools]
packages = ["gradcam"]
